name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: syntax check
        run: |
          shopt -s nullglob
          for f in *.js; do node --check "$f"; done
      - name: tests
        run: |
          if [ -d tests ]; then node --test tests/; else echo "no tests dir — skip"; fi
